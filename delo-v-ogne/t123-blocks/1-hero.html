<style>
.hero-section {
  position: relative;
  min-height: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1A0800;
  font-family: 'Montserrat', 'Arial', sans-serif;
  overflow: hidden;
  box-sizing: border-box;
}
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(10,4,0,0.55) 0%, rgba(26,10,0,0.70) 50%, rgba(10,4,0,0.85) 100%);
  z-index: 1;
}
.hero-particles { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

/* Огонёк: clip-path — острие сверху, широкий снизу, как настоящий язык пламени */
.particle {
  position: absolute;
  width: 18px;
  height: 34px;
  clip-path: polygon(
    50%  0%,    /* острие сверху */
    66%  16%,
    82%  36%,
    88%  55%,
    78%  76%,
    60%  92%,
    50% 100%,   /* центр основания */
    40%  92%,
    22%  76%,
    12%  55%,
    18%  36%,
    34%  16%
  );
  /* жёлтое ядро внизу → оранжевый → красный вверх */
  background: radial-gradient(
    ellipse at 50% 85%,
    #FFE000  0%,
    #FF7700 30%,
    #E8321A 60%,
    rgba(160, 10, 0, 0.5) 100%
  );
  opacity: 0;
  animation: flame 4s ease-in infinite;
  transform-origin: 50% 100%;
  filter: drop-shadow(0 0 5px rgba(255, 120, 0, 0.9));
}

/* Каждый огонёк — своя скорость, задержка, позиция */
.p1 { left: 13%; top: 68%; width: 20px; height: 38px; animation-delay: 0.0s; animation-duration: 3.6s; }
.p2 { left: 35%; top: 73%; width: 14px; height: 26px; animation-delay: 1.2s; animation-duration: 4.3s; }
.p3 { left: 58%; top: 67%; width: 22px; height: 42px; animation-delay: 0.4s; animation-duration: 3.2s; }
.p4 { left: 79%; top: 70%; width: 16px; height: 30px; animation-delay: 2.1s; animation-duration: 4.8s; }

/* Плавное покачивание влево-вправо имитирует живой огонь */
@keyframes flame {
  0%   { opacity: 0;   transform: translateY(0)     translateX( 0px) scaleX(1.0) scaleY(1.0); }
  8%   { opacity: 1; }
  30%  { opacity: 1;   transform: translateY(-55px)  translateX(-5px) scaleX(0.88) scaleY(0.82); }
  55%  { opacity: 0.7; transform: translateY(-110px) translateX( 6px) scaleX(0.70) scaleY(0.58); }
  80%  { opacity: 0.3; transform: translateY(-170px) translateX(-3px) scaleX(0.45) scaleY(0.30); }
  100% { opacity: 0;   transform: translateY(-220px) translateX( 2px) scaleX(0.20) scaleY(0.10); }
}
.hero-inner {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 24px 20px 28px;
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
}
/* ЛОГОТИП — главный элемент вместо текстового h1 */
.hero-logo {
  margin-bottom: 14px;
}
.hero-logo__card {
  display: inline-block;
  background: transparent;
  padding: 0;
}
.hero-logo__img {
  display: block !important;
  width: 500px !important;
  max-width: 80vw !important;
  height: auto !important;
  object-fit: contain !important;
}
.hero-eyebrow {
  display: inline-block;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #F0DBC0;
  margin-bottom: 12px;
  padding: 4px 12px;
  border: 1px solid rgba(240,219,192,0.4);
  border-radius: 100px;
}
.hero-subtitle {
  font-size: 20px;
  color: rgba(245,240,232,0.75);
  line-height: 1.6;
  margin: 0 0 16px;
  max-width: 460px;
}
.hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.hero-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 22px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 800;
  text-decoration: none;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  white-space: nowrap;
  font-family: inherit;
  box-sizing: border-box;
}
.hero-btn--primary { background: #E8321A; color: #fff !important; box-shadow: 0 4px 24px rgba(232,50,26,0.4); }
.hero-btn--primary:visited { color: #fff !important; }
.hero-btn--primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(232,50,26,0.55); }
.hero-btn--secondary { background: rgba(255,255,255,0.1); color: #F0EAE0 !important; border: 1px solid rgba(255,255,255,0.2); }
.hero-btn--secondary:visited { color: #F0EAE0 !important; }
.hero-btn--secondary:hover { background: rgba(255,255,255,0.18); transform: translateY(-2px); }
.hero-scroll {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  animation: bounce 2s infinite;
}
.hero-scroll__text { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
.hero-scroll__arrow { font-size: 18px; color: rgba(255,255,255,0.4); }
@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(6px); }
}
@media (max-width: 768px) {
  .hero-logo__img { width: 380px !important; max-width: 82vw !important; }
  .hero-subtitle { font-size: 17px; }
  .hero-ctas { flex-direction: column; width: 100%; max-width: 320px; }
  .hero-btn { justify-content: center; padding: 10px 20px; }
}
@media (max-width: 480px) {
  .hero-logo__img { width: 320px !important; max-width: 85vw !important; }
  .hero-eyebrow { font-size: 11px; }
}
@media (max-width: 360px) {
  .hero-logo__img { width: 280px !important; max-width: 88vw !important; }
}
</style>

<section class="hero-section">
  <div class="hero-overlay"></div>
  <div class="hero-particles">
    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>
    <span class="particle p4"></span>
  </div>
  <div class="hero-inner">

    <div class="hero-logo">
      <div class="hero-logo__card">
        <!-- ЛОГОТИП: замените src на ссылку из Tilda Медиа после загрузки файла -->
        <img
          src="https://optim.tildacdn.com/tild3539-6138-4465-a436-396439643639/-/format/webp/_7_-__.png.webp"
          alt="Дело в огне — шашлык на углях"
          class="hero-logo__img"
        />
      </div>
    </div>

    <span class="hero-eyebrow">Блюда на живом огне</span>

    <p class="hero-subtitle">
      Готовим на мангале. Доставляем горячим.<br>
      Кормим с душой.
    </p>

    <div class="hero-ctas">
      <a href="#delivery" class="hero-btn hero-btn--primary">Заказать доставку</a>
      <a href="tel:+7XXXXXXXXXX" class="hero-btn hero-btn--secondary">Позвонить</a>
    </div>

    <div class="hero-scroll">
      <span class="hero-scroll__text">Листайте вниз</span>
      <span class="hero-scroll__arrow">↓</span>
    </div>

  </div>
</section>
