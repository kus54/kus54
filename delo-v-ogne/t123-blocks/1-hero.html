<style>
.hero-section {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1A0800;
  font-family: 'Montserrat', 'Arial', sans-serif;
  overflow: hidden;
  box-sizing: border-box;
}
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(10,4,0,0.55) 0%, rgba(26,10,0,0.70) 50%, rgba(10,4,0,0.85) 100%);
  z-index: 1;
}
.hero-particles { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
/* Частицы — форма языка пламени: шире снизу, сужается кверху */
.particle {
  position: absolute;
  width: 12px;
  height: 20px;
  border-radius: 50% 50% 40% 40% / 30% 30% 70% 70%;
  background: radial-gradient(ellipse at 45% 30%, #FFAA00 0%, #E8321A 55%, rgba(180,20,0,0.6) 100%);
  opacity: 0;
  animation: spark 4s ease-in infinite;
  transform-origin: center bottom;
  filter: blur(0.5px);
}
/* Разные размеры для глубины */
.p1 { left: 15%; top: 65%; width: 14px; height: 22px; animation-delay: 0s; animation-duration: 3.8s; }
.p2 { left: 38%; top: 72%; width: 10px; height: 16px; animation-delay: 1.1s; animation-duration: 4.2s; }
.p3 { left: 60%; top: 68%; width: 16px; height: 26px; animation-delay: 0.5s; animation-duration: 3.5s; }
.p4 { left: 80%; top: 62%; width: 11px; height: 18px; animation-delay: 2.3s; animation-duration: 4.6s; }
@keyframes spark {
  0%   { opacity: 0;   transform: translateY(0)     translateX(0)   scale(1)   rotate(0deg); }
  15%  { opacity: 1; }
  50%  { opacity: 0.7; transform: translateY(-80px)  translateX(8px)  scale(0.75) rotate(6deg); }
  100% { opacity: 0;   transform: translateY(-180px) translateX(-6px) scale(0.2)  rotate(-8deg); }
}
.hero-inner {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 60px 20px;
  width: 100%;
  max-width: 800px;
  min-height: 100vh;
  justify-content: center;
  margin: 0 auto;
}
/* ЛОГОТИП — главный элемент вместо текстового h1 */
.hero-logo {
  margin-bottom: 36px;
}
.hero-logo__card {
  display: inline-block;
  background: #ffffff;
  border-radius: 20px;
  padding: 20px 36px;
  box-shadow:
    0 8px 40px rgba(0, 0, 0, 0.5),
    0 0 0 1px rgba(232, 50, 26, 0.2);
}
.hero-logo__img {
  display: block;
  width: auto;
  height: auto;
  max-width: 280px;
  max-height: 112px;
  object-fit: contain;
}
.hero-eyebrow {
  display: inline-block;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #F0DBC0;
  margin-bottom: 20px;
  padding: 6px 16px;
  border: 1px solid rgba(240,219,192,0.4);
  border-radius: 100px;
}
.hero-subtitle {
  font-size: 20px;
  color: rgba(245,240,232,0.75);
  line-height: 1.6;
  margin: 0 0 48px;
  max-width: 460px;
}
.hero-ctas { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.hero-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 18px 36px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  white-space: nowrap;
  font-family: inherit;
  box-sizing: border-box;
}
.hero-btn--primary { background: #E8321A; color: #fff; box-shadow: 0 4px 24px rgba(232,50,26,0.4); }
.hero-btn--primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(232,50,26,0.55); }
.hero-btn--secondary { background: rgba(255,255,255,0.1); color: #F0EAE0; border: 1px solid rgba(255,255,255,0.2); }
.hero-btn--secondary:hover { background: rgba(255,255,255,0.18); transform: translateY(-2px); }
.hero-scroll {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  animation: bounce 2s infinite;
}
.hero-scroll__text { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
.hero-scroll__arrow { font-size: 18px; color: rgba(255,255,255,0.4); }
@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(6px); }
}
@media (max-width: 768px) {
  .hero-logo__card { padding: 16px 24px; }
  .hero-logo__img { max-width: 200px; max-height: 80px; }
  .hero-subtitle { font-size: 17px; }
  .hero-ctas { flex-direction: column; width: 100%; max-width: 320px; }
  .hero-btn { justify-content: center; padding: 17px 28px; }
}
@media (max-width: 400px) {
  .hero-logo__img { max-width: 160px; max-height: 64px; }
  .hero-logo__card { padding: 12px 20px; border-radius: 14px; }
  .hero-eyebrow { font-size: 11px; }
}
</style>

<section class="hero-section">
  <div class="hero-overlay"></div>
  <div class="hero-particles">
    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>
    <span class="particle p4"></span>
  </div>
  <div class="hero-inner">

    <div class="hero-logo">
      <div class="hero-logo__card">
        <!-- ЛОГОТИП: замените src на ссылку из Tilda Медиа после загрузки файла -->
        <img
          src="https://drive.google.com/uc?export=view&id=1r_zZp9JDD2zogUvPYxpZUyV5HmAkuyx5"
          alt="Дело в огне — шашлык на углях"
          class="hero-logo__img"
        />
      </div>
    </div>

    <span class="hero-eyebrow">Блюда на живом огне</span>

    <p class="hero-subtitle">
      Готовим на мангале. Доставляем горячим.<br>
      Кормим с душой.
    </p>

    <div class="hero-ctas">
      <a href="#delivery" class="hero-btn hero-btn--primary">Заказать доставку</a>
      <a href="tel:+7XXXXXXXXXX" class="hero-btn hero-btn--secondary">Позвонить</a>
    </div>

    <div class="hero-scroll">
      <span class="hero-scroll__text">Листайте вниз</span>
      <span class="hero-scroll__arrow">↓</span>
    </div>

  </div>
</section>
