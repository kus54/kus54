<style>
/* ===================================================
   БАННЕР «СКОРО ОТКРЫТИЕ»
   Убрать блок из Tilda после открытия.
   Контент ниже остаётся в HTML — Google индексирует.
   =================================================== */
.preopen-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 25%, #3A1200 0%, #1A0800 55%, #080300 100%);
  font-family: 'Montserrat', 'Arial', sans-serif;
  text-align: center;
  padding: 28px 24px;
  box-sizing: border-box;
  overflow: hidden;
}
.preopen-overlay::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 80%, rgba(232,50,26,0.07) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,120,0,0.06) 0%, transparent 40%);
  pointer-events: none;
}
/* Логотип */
.preopen-logo-wrap {
  margin-bottom: 20px;
  animation: fadein 0.8s ease both;
}
.preopen-logo {
  width: 420px;
  max-width: 80vw;
  height: auto;
  display: block;
  filter: drop-shadow(0 0 40px rgba(232,50,26,0.4));
}
@keyframes fadein {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0); }
}
/* Адрес с картами */
.preopen-address {
  display: flex;

}
.preopen-map-links {

}

  max-width: 380px;

}
.preopen-divider {
  width: 40px;
  height: 2px;
  background: linear-gradient(90deg, transparent, #E8321A, transparent);
  margin: 0 auto 24px;
  animation: fadein 0.8s 0.4s ease both;
}
/* Большая кнопка телефона */
.preopen-phone-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  /* =============================================
     ВСТАВЬТЕ НОМЕР ТЕЛЕФОНА:
     1. В атрибут href: замените +7XXXXXXXXXX
        на ваш номер без пробелов и скобок
        Пример: href="tel:+79131234567"
     2. В текст кнопки ниже: замените
        +7 (XXX) XXX-XX-XX на ваш номер
     ============================================= */

  max-width: 340px;
  padding: 16px 28px;
  background: #E8321A;
  color: #fff;
  font-size: 20px;
  font-weight: 800;
  text-decoration: none;
  border-radius: 16px;
  box-shadow: 0 6px 28px rgba(232,50,26,0.45);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  margin-bottom: 14px;
  animation: fadein 0.8s 0.45s ease both;
  font-family: inherit;
  letter-spacing: 0.03em;
}
.preopen-phone-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 36px rgba(232,50,26,0.6); }
/* Соцсети */
.preopen-socials {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
  animation: fadein 0.8s 0.5s ease both;
}
.preopen-social-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 10px 20px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  transition: transform 0.2s ease, opacity 0.2s;
  font-family: inherit;
  white-space: nowrap;
  border: 1px solid;
}
.preopen-social-btn:hover { transform: translateY(-2px); opacity: 0.85; }
.preopen-social-btn--tg  { color: #27A7E5; border-color: rgba(39,167,229,0.4);  background: rgba(39,167,229,0.1); }
.preopen-social-btn--vk  { color: #5B9FFF; border-color: rgba(91,159,255,0.4);  background: rgba(91,159,255,0.1); }
.preopen-social-btn--max { color: #00D278; border-color: rgba(0,210,120,0.4);   background: rgba(0,210,120,0.1); }
/* Домен */
.preopen-domain {
  font-size: 12px;
  color: rgba(255,255,255,0.2);
  letter-spacing: 0.1em;
  animation: fadein 0.8s 0.55s ease both;
}
@media (max-width: 480px) {
  .preopen-logo { width: 280px; }
  .preopen-title { font-size: 28px; }
  .preopen-phone-btn { font-size: 17px; padding: 14px 20px; }
  .preopen-socials { flex-direction: column; align-items: center; }
  .preopen-social-btn { width: 220px; justify-content: center; }
}
</style>

<script>
(function () {
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  var BLOCK_KEYS = [27, 32, 33, 34, 37, 38, 39, 40];
  document.addEventListener('keydown', function (e) {
    if (BLOCK_KEYS.indexOf(e.keyCode) !== -1) e.preventDefault();
  }, { passive: false });
  document.addEventListener('wheel', function (e) {
    if (document.getElementById('preopen-overlay')) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', function (e) {
    if (document.getElementById('preopen-overlay')) e.preventDefault();
  }, { passive: false });
})();
</script>
