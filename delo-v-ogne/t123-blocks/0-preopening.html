<style>

.preopen-overlay {

  z-index: 9999;

  padding: 32px 24px;
  box-sizing: border-box;
  overflow: hidden;
}
/* Частицы-угольки в фоне */
.preopen-overlay::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 80%, rgba(232,50,26,0.07) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,120,0,0.06) 0%, transparent 40%);

  margin: 0 0 12px;
  animation: fadein 0.8s 0.25s ease both;
}
.preopen-sub {
  font-size: 16px;
  color: rgba(240,234,224,0.55);
  line-height: 1.7;
  margin: 0 0 28px;
  max-width: 400px;
  animation: fadein 0.8s 0.35s ease both;
}
.preopen-divider {
  width: 40px;
  height: 2px;
  background: linear-gradient(90deg, transparent, #E8321A, transparent);
  margin: 0 auto 28px;

.preopen-contacts {

.preopen-btn--primary {

  color: #fff;
  box-shadow: 0 4px 20px rgba(232,50,26,0.4);
}
.preopen-btn--primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(232,50,26,0.55); }
.preopen-btn--ghost {
  background: rgba(255,255,255,0.07);
  color: #F0DBC0;
  border: 1px solid rgba(255,255,255,0.15);
}
.preopen-btn--ghost:hover { background: rgba(255,255,255,0.13); transform: translateY(-2px); }
.preopen-note {

  color: rgba(255,255,255,0.2);

@media (max-width: 480px) {

  .preopen-contacts { flex-direction: column; width: 100%; max-width: 260px; }

</style>

<script>
(function () {
  /* Блокируем скролл фоновой страницы */
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';

  /* Блокируем ESC, пробел, стрелки и колёсико мыши */
  var BLOCK_KEYS = [27, 32, 33, 34, 37, 38, 39, 40];
  document.addEventListener('keydown', function (e) {
    if (BLOCK_KEYS.indexOf(e.keyCode) !== -1) e.preventDefault();
  }, { passive: false });
  document.addEventListener('wheel', function (e) {
    if (document.getElementById('preopen-overlay')) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', function (e) {
    if (document.getElementById('preopen-overlay')) e.preventDefault();
  }, { passive: false });
})();
</script>
