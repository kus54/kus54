<style>
.gallery-section {
  background: #0A0A0A;
  padding: 80px 20px;
  font-family: 'Montserrat', 'Arial', sans-serif;
  box-sizing: border-box;
  overflow: hidden;
}
.gallery-inner { max-width: 1200px; margin: 0 auto; }
.gallery-header { text-align: center; margin-bottom: 48px; }
.gallery-label {
  display: inline-block;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #E8321A;
  margin-bottom: 12px;
}
.gallery-title {
  font-size: 42px;
  font-weight: 700;
  color: #F0EAE0;
  margin: 0;
  line-height: 1.15;
}
.gallery-track {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}
.gallery-card {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  background: #1A1A1A;
}
.gallery-card__img-wrap {
  width: 100%;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  position: relative;
}
.gallery-card__img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
  background: linear-gradient(135deg, #1E1E1E 0%, #2A2020 50%, #1A1010 100%);
}
.gallery-card__placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  pointer-events: none;
}
.gallery-card__placeholder-icon { font-size: 32px; opacity: 0.25; }
.gallery-card__placeholder-text {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(240,219,192,0.3);
}
.gallery-card__overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(10,4,0,0.88) 100%);
  opacity: 0;
  transition: opacity 0.3s ease;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 20px 16px;
}
.gallery-card:hover .gallery-card__overlay { opacity: 1; }
.gallery-card:hover .gallery-card__img { transform: scale(1.05); }
.gallery-card__cat {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #E8321A;
  margin-bottom: 4px;
}
.gallery-card__caption {
  font-size: 14px;
  font-weight: 600;
  color: #F0EAE0;
  line-height: 1.3;
}
.gallery-card__badge {
  position: absolute;
  top: 12px;
  left: 12px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #F0EAE0;
  background: rgba(10,4,0,0.65);
  backdrop-filter: blur(4px);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.12);
}
@media (max-width: 1024px) {
  .gallery-track { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 700px) {
  .gallery-section { padding: 60px 0 60px 16px; }
  .gallery-header { padding-right: 16px; }
  .gallery-track {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding-right: 16px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .gallery-track::-webkit-scrollbar { display: none; }
  .gallery-card {
    flex: 0 0 200px;
    scroll-snap-align: start;
  }
  .gallery-card__img-wrap { aspect-ratio: 3 / 4; }
  .gallery-title { font-size: 28px; }
}
</style>
