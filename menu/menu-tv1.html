<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дело в огне — меню</title>
<style>
@page { size: A4 landscape; margin: 7mm; }
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; }
}
:root {
  --page:#0c0c0e;
  --shell:#151517;
  --panel:#1b1c20;
  --panel-2:#202126;
  --line:rgba(255,255,255,0.08);
  --line-strong:rgba(212,43,26,0.22);
  --text:#f5efe8;
  --muted:rgba(245,239,232,0.62);
  --accent:#D42B1A;
  --accent-soft:#FF6B6B;
  --accent-bg:rgba(212,43,26,0.12);
  --hot-1:rgba(212,43,26,0.17);
  --hot-2:rgba(212,43,26,0.07);
  --shadow:0 14px 34px rgba(0,0,0,0.24);
  --radius-xl:8mm;
  --radius-lg:4.5mm;
  --radius-md:3mm;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: var(--page);
  color: var(--text);
}
.sheet {
  width: 297mm;
  min-height: 210mm;
  margin: 0 auto;
  background: radial-gradient(circle at top left, rgba(212,43,26,0.04), transparent 22%), var(--page);
}
.menu {
  min-height: 210mm;
  padding: 7mm;
}
.shell {
  min-height: 196mm;
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.header {
  display:grid;
  grid-template-columns: 48mm 1fr;
  gap: 5mm;
  align-items: center;
  padding: 5mm 5.5mm 4.2mm;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,0.018), rgba(255,255,255,0));
}
.logo-box {
  display:flex;
  align-items:center;
  justify-content:flex-start;
}
.logo-box img {
  display:block;
  width: 46mm;
  height:auto;
}
.hero {
  min-width:0;
}
.hero-title {
  font-size: 13pt;
  font-weight: 900;
  letter-spacing: -0.03em;
  color: #fff8f2;
}
.hero-sub {
  margin-top: 1mm;
  font-size: 7pt;
  color: var(--muted);
}
.hero-tags {
  display:flex;
  flex-wrap:wrap;
  gap:1.6mm;
  margin-top:2mm;
}
.hero-tag {
  display:inline-flex;
  align-items:center;
  padding:1.05mm 2.5mm;
  border-radius:999px;
  background: rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  color:#fff8f2;
  font-size:6.5pt;
  font-weight:800;
  letter-spacing:0.03em;
}
.content {
  padding: 3mm;
}
.grid {
  display:grid;
  grid-template-columns: 1.14fr 0.92fr 0.88fr;
  gap: 3mm;
}
.col {
  display:flex;
  flex-direction:column;
  gap:3mm;
}
.card {
  position:relative;
  padding:3.1mm 3.2mm;
  border-radius:var(--radius-lg);
  background: linear-gradient(180deg, rgba(255,255,255,0.016), rgba(255,255,255,0.008));
  border:1px solid var(--line);
}
.card::before {
  content:"";
  position:absolute;
  left:0; right:0; top:0;
  height:1.5mm;
  background: linear-gradient(90deg, rgba(212,43,26,0.88), rgba(212,43,26,0.22) 58%, transparent);
}
.card.soft {
  background: linear-gradient(180deg, rgba(255,255,255,0.012), rgba(255,255,255,0.006));
}
.sec-top {
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:2mm;
  margin-bottom:2mm;
}
.sec-left { min-width:0; }
.kicker {
  display:inline-flex;
  align-items:center;
  padding:0.82mm 2mm;
  border-radius:999px;
  background:var(--accent-bg);
  border:1px solid rgba(212,43,26,0.26);
  color:var(--accent-soft);
  font-size:5.8pt;
  font-weight:800;
  letter-spacing:0.08em;
  text-transform:uppercase;
}
.sec-title {
  margin-top:1.2mm;
  font-size:7.9pt;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:0.13em;
}
.sec-sub {
  font-size:6.4pt;
  color:var(--muted);
  text-align:right;
  white-space:nowrap;
}
.row {
  display:grid;
  grid-template-columns: 1fr auto auto;
  gap:1.7mm;
  align-items:baseline;
  padding:1.2mm 0;
  border-bottom:1px dotted var(--line);
}
.row:last-child { border-bottom:none; }
.row-name {
  font-size:7.85pt;
  line-height:1.15;
}
.row-measure {
  min-width:14mm;
  text-align:right;
  font-size:6.7pt;
  color:var(--muted);
  white-space:nowrap;
}
.row-price {
  min-width:14mm;
  text-align:right;
  font-size:8.05pt;
  color:var(--accent-soft);
  font-weight:900;
  white-space:nowrap;
}
.row.blank {
  opacity: 0.35;
  border-bottom: 1px dashed rgba(232,50,26,0.35) !important;
}
.row.blank .row-name,
.row.blank .row-measure,
.row.blank .row-price {
  color: transparent;
  user-select: none;
}
.row.blank .row-name::after {
  content: '';
  color: rgba(232,50,26,0.4);
  font-size: 6pt;
  font-style: italic;
  letter-spacing: 0.1em;
}
.grill-item {
  display:grid;
  grid-template-columns: 1fr auto auto;
  gap:2mm;
  align-items:flex-start;
  padding:1.85mm 0;
  border-bottom:1px solid var(--line);
}
.grill-item:last-child { border-bottom:none; }
.grill-item.hot {
  padding:2.1mm 2.2mm;
  margin-bottom:1.2mm;
  border-radius:var(--radius-md);
  background:
    radial-gradient(circle at top right, rgba(212,43,26,0.13), transparent 42%),
    linear-gradient(180deg, var(--hot-1), var(--hot-2));
  border:1px solid var(--line-strong);
}
.grill-main { min-width:0; }
.grill-head {
  display:flex;
  align-items:center;
  gap:1.2mm;
  flex-wrap:wrap;
}
.grill-name {
  font-size:9pt;
  font-weight:820;
  line-height:1.08;
}
.grill-sub {
  margin-top:0.75mm;
  font-size:6.3pt;
  color:var(--muted);
}
.grill-measure {
  min-width:23mm;
  text-align:right;
  font-size:7.2pt;
  font-weight:750;
  white-space:nowrap;
}
.grill-price {
  min-width:27mm;
  text-align:right;
  font-size:8.45pt;
  font-weight:900;
  color:var(--accent-soft);
  white-space:nowrap;
}
.mini-tag {
  display:inline-flex;
  align-items:center;
  padding:0.72mm 1.85mm;
  border-radius:999px;
  background:var(--accent-bg);
  border:1px solid rgba(212,43,26,0.24);
  color:var(--accent-soft);
  font-size:5.75pt;
  font-weight:900;
  white-space:nowrap;
}
.big-link {
  display:flex;
  flex-direction:column;
  gap:1.45mm;
}
.big-row {
  display:grid;
  grid-template-columns: 1fr auto auto;
  gap:1.7mm;
  align-items:center;
  padding:1.8mm 2.2mm;
  border-radius:var(--radius-md);
  background: var(--panel-2);
  border:1px solid var(--line);
}
.big-row.hot {
  background:
    radial-gradient(circle at top right, rgba(212,43,26,0.13), transparent 42%),
    linear-gradient(180deg, var(--hot-1), var(--hot-2));
  border:1px solid var(--line-strong);
}
.big-name { font-size:8.45pt; font-weight:820; }
.big-measure { font-size:6.8pt; color:var(--muted); white-space:nowrap; }
.big-price { font-size:8.25pt; color:var(--accent-soft); font-weight:900; white-space:nowrap; }
.group-card {
  display:grid;
  grid-template-columns: 1fr auto;
  gap:2.5mm;
  align-items:start;
}
.group-card .sec-top {
  margin-bottom:1.8mm;
}
.group-grid {
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:1.3mm;
  align-items:start;
}
.group-col {
  display:flex;
  flex-direction:column;
  gap:1.2mm;
}
.group-pill {
  min-height: 8.8mm;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:1.1mm 1.6mm;
  border-radius:3.2mm;
  background: var(--panel-2);
  border:1px solid var(--line);
  font-size:6.6pt;
  line-height:1.1;
}
.meta {
  display:flex;
  align-items:baseline;
  gap:1.2mm;
  white-space:nowrap;
}
.meta-volume {
  font-size:6.4pt;
  color:var(--muted);
}
.meta-price {
  font-size:8.2pt;
  color:var(--accent-soft);
  font-weight:900;
}
.stack-tight .row { padding:1.05mm 0; }
.footer {
  padding:2.2mm 5mm 3mm;
  text-align:center;
  font-size:5.7pt;
  letter-spacing:0.08em;
  color:rgba(245,239,232,0.48);
}
  <div class="body">
    <div class="section">
      <div class="section-head">
        <div class="section-title">Мясо на углях <span class="fire-deco">🔥</span></div>
        <div class="section-sub">называйте вес · от 100 г</div>
      </div>
      <div class="section-note">Цена за 100 г · взвешиваем при вас · чем больше берёте — выгоднее</div>
      <div class="grill-grid">
        <div class="grill-item">
          <div class="hit-badge">🔥 Хит</div>
          <div class="grill-name">Шашлык из свинины</div>
          <div class="grill-desc">Свиная шейка в авторском маринаде — сочная, с аппетитной корочкой</div>
          <div class="grill-bottom">
            <div class="grill-measure">200 р. / 100 г</div>
            <div class="grill-anchor">
              <span class="grill-anchor-qty">чаще берут 300 г →</span>
              <span class="grill-anchor-price">600 р.</span>
            </div>
          </div>
        </div>

        <div class="grill-item">
          <div class="hit-badge">🔥 Хит</div>
          <div class="grill-name">Люля-кебаб</div>
          <div class="grill-desc">Рубленая свинина и говядина со специями на шампуре</div>
          <div class="grill-bottom">
            <div class="grill-measure">256 р. / 100 г</div>
            <div class="grill-anchor">
              <span class="grill-anchor-qty">чаще берут 300 г →</span>
              <span class="grill-anchor-price">768 р.</span>
            </div>
          </div>
        </div>

        <div class="grill-item">
          <div class="grill-name">Куриное бедро</div>
          <div class="grill-desc">Нежное мясо с хрустящей кожицей, приготовленное на мангале</div>
          <div class="grill-bottom">
            <div class="grill-price-fixed">590 р.</div>
            <div class="grill-weight">1 шт.</div>
          </div>
        </div>

        <div class="grill-item">
          <div class="grill-name">Куриная грудка</div>
          <div class="grill-desc">Филе на живом огне — сочно и легко</div>
          <div class="grill-bottom">
            <div class="grill-price-fixed">590 р.</div>
            <div class="grill-weight">1 шт.</div>
          </div>
        </div>

        <div class="grill-item">
          <div class="grill-name">Крылья на мангале</div>
          <div class="grill-desc">Хрустящие снаружи, сочные внутри</div>
          <div class="grill-bottom">
            <div class="grill-price-fixed">480 р.</div>
            <div class="grill-weight">300 г</div>
          </div>
        </div>

        <div class="grill-item">
          <div class="grill-name">Стейк бедра куриный</div>
          <div class="grill-desc">Сочный куриный стейк на живом огне</div>
          <div class="grill-bottom">
            <div class="grill-price-fixed">590 р.</div>
            <div class="grill-weight">1 шт.</div>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title">Овощи и гриль</div>
      </div>
      <div class="row-list">
        <div class="row-item">
          <div class="row-left">
            <div class="row-name">Овощи на огне</div>
            <div class="row-desc">Болгарский перец, кабачки, помидоры, грибы</div>
          </div>
          <div class="row-right">
            <div class="row-price">900 р.</div>
            <div class="row-weight">порция</div>
          </div>
        </div>
        <div class="row-item">
          <div class="row-left">
            <div class="row-name">Грибы на огне</div>
            <div class="row-desc">Шампиньоны на мангале — с дымком и зеленью</div>
          </div>
          <div class="row-right">
            <div class="row-price">540 р.</div>
            <div class="row-weight">порция</div>
          </div>
        </div>
        <div class="row-item">
          <div class="row-left">
            <div class="row-name">Картофель в беконе</div>
            <div class="row-desc">Запечённый на углях картофель в хрустящем беконе</div>
          </div>
          <div class="row-right">
            <div class="row-price">550 р.</div>
            <div class="row-weight">порция</div>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title">Шашлык в лаваше</div>
        <div class="section-sub">мясо + лук + соус</div>
      </div>
      <div class="row-list">
        <div class="row-item">
          <div class="row-left">
            <div class="row-name">Свинина в лаваше</div>
            <div class="row-desc">Шашлык из свинины, маринованный лук, соус</div>
          </div>
          <div class="row-right">
            <div class="row-price">450 р.</div>
            <div class="row-weight">300 г</div>
          </div>
        </div>
        <div class="row-item">
          <div class="row-left">
            <div class="row-name">Курица в лаваше</div>
            <div class="row-desc">Шашлык из курицы, маринованный лук, соус</div>
          </div>
          <div class="row-right">
            <div class="row-price">450 р.</div>
            <div class="row-weight">300 г</div>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title">Комплексы</div>
        <div class="section-sub">мясо + лук + соус + лаваш</div>
      </div>
      <div class="combo-grid">
        <div class="combo-item">
          <div class="combo-name">Комплекс №1</div>
          <div class="combo-desc">Свинина на углях, маринованный лук, кетчуп + чесночный, лаваш</div>
          <div class="combo-price">490 р.</div>
        </div>
        <div class="combo-item">
          <div class="combo-name">Комплекс №2</div>
          <div class="combo-desc">Колбаски охотничьи, лук, картофель по-деревенски, соус, лаваш</div>
          <div class="combo-price">490 р.</div>
        </div>
        <div class="combo-item">
          <div class="combo-name">Комплекс №3</div>
          <div class="combo-desc">Куриное бедро на углях, маринованный лук, соус, лаваш</div>
          <div class="combo-price">460 р.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">Приятного аппетита!</div>
    <div class="footer-right">Экран 1</div>
  </div>
</div>
</body>
</html>
